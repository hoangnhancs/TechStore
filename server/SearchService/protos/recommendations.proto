syntax = "proto3";

option csharp_namespace = "Recommendations.Grpc";

service GrpcRecommendation {
    rpc GetSuggestProduct (GetSuggestProductRequest) returns (GrpcSuggestProductResponse);
}

message GetSuggestProductRequest {
    optional string userId = 1;
    int32 numberOfProducts = 2; 
}

message GrpcSuggestProductResponse {
    repeated string productIds = 1;
}