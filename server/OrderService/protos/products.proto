syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ProductService";

service GrpcProduct {
    rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
}

message GrpcProductFilterTagValueDto {
  int32 id = 1;
  int32 filter_tag_id = 2;
  int32 filter_tag_value_id = 3;
  string product_id = 4;
}

message GrpcProductAttributeDto {
  string name = 1;
  string value = 2;
  string attribute_type = 3;
  int64 display_order = 4;
}

// Reserve stock messages
message ReserveStockRequest {
  repeated ReserveStockItem items = 1;
}

message ReserveStockItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  bool success = 1;
  repeated StockReservationResult results = 2;
  string error_message = 3;
}

message StockReservationResult {
  string product_id = 1;
  string product_name = 2;
  bool success = 3;
  int32 requested_quantity = 4;
  int32 available_quantity = 5;
  string error_message = 6;
}
