name: Deploy ProductService to Azure

on:
  push:
    branches: [main]
    paths:
      - "server/ProductService/**"
      - "server/BuildingBlocks/**"
      - "server/Contract/**"
      - ".github/workflows/deploy-product-svc.yml"
  workflow_dispatch: # cho phép bấm chạy tay từ tab Actions trên GitHub, không cần push code

permissions:
  id-token: write # bắt buộc cho OIDC — xin token tạm từ GitHub để trao đổi với Azure AD
  contents: read

env:
  ACR_NAME: techstoreacr
  IMAGE_NAME: product-svc
  RESOURCE_GROUP: techstore-rg
  CONTAINER_APP_NAME: product-svc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Đăng nhập Azure (OIDC, không cần secret dài hạn)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Đăng nhập ACR (dùng chung quyền Azure vừa login, không cần credential riêng)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build + push Docker image (tag theo git sha để truy vết đúng commit nào đang chạy)
        run: |
          IMAGE_TAG=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -f server/ProductService/Dockerfile -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Cập nhật Container App sang image mới
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.IMAGE_TAG }}"

      - name: Verify deployment healthy
        run: |
          sleep 20
          curl -f https://product-svc.jollycoast-d6b821c1.southeastasia.azurecontainerapps.io/api/products/all



      #Để truyền giá trị IMAGE_TAG sang bước tiếp theo trong cùng workflow — vì mỗi step (mỗi khối run:) trong GitHub Actions chạy trong 1 process shell riêng biệt, độc lập, biến shell thường ($IMAGE_TAG) set ở step này sẽ mất khi qua step kế tiếp, giống như đóng terminal rồi mở terminal mới vậy.
      # $GITHUB_ENV là 1 file đặc biệt do GitHub Actions runner tự tạo sẵn cho mỗi job — bất kỳ dòng KEY=VALUE nào bạn echo ... >> "$GITHUB_ENV" thì từ step tiếp theo trở đi (trong cùng job), biến đó sẽ tự có sẵn dưới dạng env.KEY ở ngữ cảnh ${{ }}, hoặc $KEY nếu dùng trong run: shell.

      # Áp vào đúng đoạn này: IMAGE_TAG được tính động (ghép theo github.sha lúc runtime, không biết trước giá trị), tính xong ở step "Build + push Docker image" thì ghi vào $GITHUB_ENV — để step kế tiếp "Cập nhật Container App sang image mới" (deploy-product-svc.yml:47-52) dùng lại đúng giá trị đó qua ${{ env.IMAGE_TAG }}:


      # Lưu ý: workflow này CHỈ cập nhật image, KHÔNG đụng tới secret/env-vars.
      # Secret (JWT key, Cloudinary, RabbitMQ, DB connection) đã set 1 lần lúc deploy thủ công
      # và tiếp tục giữ nguyên qua các lần update sau. Muốn đổi secret thì sửa tay
      # azure/containerapp-product-svc.yaml rồi chạy cục bộ:
      #   az containerapp update --name product-svc --resource-group techstore-rg --yaml azure/containerapp-product-svc.yaml
      # (--name luôn bắt buộc, kể cả khi đã có --yaml) — không làm việc đó trong CI/CD.
